name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The repository is made on Windows, where the executable bit does not exist.
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: isomap-jars
          # One jar per loader; the common project builds no release jar.
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
