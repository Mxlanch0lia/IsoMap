pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
    plugins {
        id 'net.neoforged.moddev' version '2.0.148'
        // The variant of Loom for Minecraft versions that still ship obfuscated, 1.21.1 among them.
        id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
        id 'net.fabricmc.fabric-loom' version '1.19.4'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'isomap'

// common: the map itself, against plain Minecraft. neoforge and fabric: thin glue that compiles common in with it.
include 'common', 'neoforge', 'fabric'

// Minecraft 26.1.2 and 26.3: the same layout, built from mc26/src (see mc26/lines.gradle).
['26.1', '26.3'].each { line ->
    ['common', 'neoforge', 'fabric'].each { kind ->
        include "${kind}-${line}"
        project(":${kind}-${line}").projectDir = file("mc26/${line}/${kind}")
    }
}
